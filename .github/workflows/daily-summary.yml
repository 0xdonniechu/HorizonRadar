name: Daily Horizon Summary

on:
  # schedule:
  #   - cron: '0 9 */1 * *'  # Runs every days at 00:00 UTC
  #     timezone: 'UTC'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: |
          mkdir -p data
          cat << 'EOF' > data/config.json
          {
            "ai": {
              "provider": "deepseek",
              "model": "deepseek-v4-flash",
              "api_key_env": "DEEPSEEK_API_KEY"
            },
            "filtering": {
              "prompt": "High-quality updates on Artificial Intelligence (AI models, open-source tools, LLMs), tech industry trends, business market analysis, global economic shifts, and innovative startup ecosystems.",
              "threshold": 7.0,
              "time_window_hours": 48
            },
            "notification": {
              "telegram": {
              "enabled": true,
              "bot_token_env": "8980204644:AAHQGVaVIyN5OQ2pSJPqOgHpefVVCpvUkFg",
              "chat_id_env": "8112291996"
              }
            },
            "sources": {
              "rss": [
                {
                  "id": "latent_space",
                  "name": "The AI Engineer newsletter + Top technical AI podcast",
                  "url": "https://www.latent.space/feed"
                },
                {
                  "id": "openai_blog",
                  "name": "OpenAI Blog",
                  "url": "https://openai.com/news/rss.xml"
                },
                {
                  "id": "simon_willison",
                  "name": "Simon Willison's Weblog",
                  "url": "https://simonwillison.net/atom/everything/"
                },
                {
                  "id": "pragmatic_engineer",
                  "name": "The Pragmatic Engineer",
                  "url": "https://newsletter.pragmaticengineer.com/feed"
                },
                {
                  "id": "machine_learning_mastery",
                  "name": "Machine Learning Mastery",
                  "url": "https://machinelearningmastery.com/feed/"
                }
              ],
              "reddit_subreddit": [
                {
                  "id": "localllama",
                  "name": "LocalLLaMA"
                },
                {
                  "id": "machinelearning",
                  "name": "MachineLearning"
                },
                {
                  "id": "stablediffusion",
                  "name": "StableDiffusion"
                }
              ],
              "github_repo": [
                {
                  "id": "vllm",
                  "url": "https://github.com/vllm-project/vllm"
                }
              ]
            }
          }
          EOF

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
        run: uv run horizon --hours 48

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
